- name: variables from prompt
  hosts: local
  connection: local
  vars_prompt:
  - name: username
    prompt: please enter username
    private: true

  - name: password
    prompt: please enter password
    private: true

  tasks:
  - name: printing user information
    ansible.builtin.debug:
      msg: "Hellow username is {{ username }} and password is {{ password }}" 